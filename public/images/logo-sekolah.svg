<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192f" />
      <stop offset="50%" stop-color="#0b2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Circular Ring -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#dropShadow)" />
  <circle cx="120" cy="120" r="102" fill="url(#shieldGrad)" />
  <circle cx="120" cy="120" r="98" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Laurel Wreath Leaves (Left) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <ellipse cx="44" cy="120" rx="6" ry="3" transform="rotate(-30 44 120)" />
    <ellipse cx="48" cy="98" rx="6" ry="3" transform="rotate(-15 48 98)" />
    <ellipse cx="58" cy="78" rx="6" ry="3" transform="rotate(0 58 78)" />
    <ellipse cx="74" cy="62" rx="6" ry="3" transform="rotate(15 74 62)" />
    <ellipse cx="94" cy="50" rx="6" ry="3" transform="rotate(30 94 50)" />
    <!-- Laurel Wreath Leaves (Right) -->
    <ellipse cx="196" cy="120" rx="6" ry="3" transform="rotate(30 196 120)" />
    <ellipse cx="192" cy="98" rx="6" ry="3" transform="rotate(15 192 98)" />
    <ellipse cx="182" cy="78" rx="6" ry="3" transform="rotate(0 182 78)" />
    <ellipse cx="166" cy="62" rx="6" ry="3" transform="rotate(-15 166 62)" />
    <ellipse cx="146" cy="50" rx="6" ry="3" transform="rotate(-30 146 50)" />
  </g>

  <!-- Central Shield -->
  <path d="M120,52 C150,52 165,65 165,95 C165,140 120,168 120,168 C120,168 75,140 75,95 C75,65 90,52 120,52 Z" fill="#ffffff" opacity="0.08" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Open Book of Knowledge -->
  <path d="M88,124 C102,118 114,122 120,126 C126,122 138,118 152,124 L152,106 C138,100 126,104 120,108 C114,104 102,100 88,106 Z" fill="#ffffff" />
  <line x1="120" y1="108" x2="120" y2="136" stroke="#0b2545" stroke-width="2.5" />
  <line x1="94" y1="114" x2="114" y2="114" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="94" y1="119" x2="112" y2="119" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="126" y1="114" x2="146" y2="114" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="128" y1="119" x2="146" y2="119" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Torch of Education -->
  <path d="M116,74 L124,74 L121,102 L119,102 Z" fill="url(#goldGrad)" />
  <!-- Flame -->
  <path d="M120,55 C126,63 130,68 120,78 C110,68 114,63 120,55 Z" fill="#ef4444" />
  <circle cx="120" cy="68" r="3.5" fill="#fbbf24" />

  <!-- Golden 5-Point Star -->
  <polygon points="120,36 122.5,42 129,42 124,46 126,52 120,48 114,52 116,46 111,42 117.5,42" fill="url(#goldGrad)" />

  <!-- Ribbon Banner Bottom -->
  <path d="M48,172 L192,172 L182,194 L120,190 L58,194 Z" fill="url(#goldGrad)" filter="url(#dropShadow)" />
  <text x="120" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#07192f" text-anchor="middle" letter-spacing="1">SMAN 1 HARAPAN BANGSA</text>
  <text x="120" y="212" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">TERAKREDITASI A • EST. 1986</text>
</svg>