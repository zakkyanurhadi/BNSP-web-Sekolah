<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="480" rx="16" fill="url(#bgGrad)" />
  <!-- Decorative Circles -->
  <circle cx="340" cy="80" r="120" fill="#ffffff" opacity="0.03" />
  <circle cx="60" cy="400" r="140" fill="#ffffff" opacity="0.03" />
  <circle cx="200" cy="180" r="125" fill="#f8fafc" opacity="0.08" />
  
  <!-- Silhouette / Professional Portrait Vector -->
  <!-- Shoulders & Suit -->
  <path d="M70,480 L110,330 C130,310 160,305 200,305 C240,305 270,310 290,330 L330,480 Z" fill="url(#suitGrad)" />
  <!-- Shirt Collar & Tie -->
  <polygon points="175,305 225,305 215,360 185,360" fill="#ffffff" />
  <!-- Blue / Gold Tie -->
  <polygon points="195,315 205,315 210,430 200,450 190,430" fill="#2563eb" />
  <path d="M194,340 L206,340 M192,370 L208,370 M190,400 L210,400" stroke="#f59e0b" stroke-width="2" />
  <!-- Suit Lapels -->
  <polygon points="150,310 185,410 165,480 110,330" fill="#334155" />
  <polygon points="250,310 215,410 235,480 290,330" fill="#334155" />
  
  <!-- Head & Neck -->
  <rect x="180" y="240" width="40" height="70" fill="url(#skinGrad)" rx="6" />
  <ellipse cx="200" cy="210" rx="60" ry="75" fill="url(#skinGrad)" />
  
  <!-- Hair -->
  <path d="M140,195 C140,135 170,125 200,125 C230,125 260,135 260,195 C255,160 240,140 200,140 C160,140 145,160 140,195 Z" fill="#1e293b" />
  <ellipse cx="140" cy="210" rx="8" ry="16" fill="url(#skinGrad)" />
  <ellipse cx="260" cy="210" rx="8" ry="16" fill="url(#skinGrad)" />

  <!-- Eyeglasses -->
  <rect x="160" y="195" width="30" height="20" rx="4" fill="none" stroke="#0f172a" stroke-width="3" />
  <rect x="210" y="195" width="30" height="20" rx="4" fill="none" stroke="#0f172a" stroke-width="3" />
  <line x1="190" y1="205" x2="210" y2="205" stroke="#0f172a" stroke-width="3" />
  <!-- Eyes inside glasses -->
  <circle cx="175" cy="205" r="3" fill="#0f172a" />
  <circle cx="225" cy="205" r="3" fill="#0f172a" />
  
  <!-- Smile & Nose -->
  <path d="M198,212 L202,212 L200,225 Z" fill="#ea580c" />
  <path d="M182,242 Q200,256 218,242" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Badge Overlay on Bottom -->
  <rect x="25" y="415" width="350" height="50" rx="8" fill="#0f172a" opacity="0.9" />
  <text x="200" y="437" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Drs. H. Ahmad Sudrajat, M.Pd.</text>
  <text x="200" y="453" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Kepala SMA Negeri 1 Harapan Bangsa</text>
</svg>